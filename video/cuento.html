<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Las Cenizas de Vharn — el cuento</title>
<link rel="stylesheet" href="lib/style.css">
<style>
  .cards { z-index: 20; }
  .card { position: absolute; top: 170px; width: 440px; height: 560px; overflow: hidden; border-radius: 3px;
    box-shadow: 0 0 0 1px rgba(228,181,98,.5), 0 0 0 8px rgba(8,6,4,.7), 0 0 0 9px rgba(228,181,98,.25), 0 30px 90px rgba(0,0,0,.85); }
  .card img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
  .card .shade { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,.8)); }
  .nights { z-index: 30; }
  .night { position: absolute; top: 330px; width: 220px; text-align: center; }
  .night .orb { width: 120px; height: 120px; margin: 0 auto 26px; border-radius: 50%;
    border: 1px solid rgba(228,181,98,.6); box-shadow: inset 0 0 30px rgba(0,0,0,.8); }
  .night .lab { font-family: Cinzel, serif; font-size: 30px; letter-spacing: .3em; color: var(--gold); text-shadow: 0 2px 8px #000; }
  .logo { z-index: 85; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="lib/engine.js"></script>
<script>
const { bg, framed, txt, custom, kf, levels, ease, clamp, lerp, env, el, img } = E;
const I = (f) => '../wiki/Imágenes/' + f;
const P = (f) => '../public/' + f;
E.duration = 121;

// Texto narrado: abajo a la izquierda, como la voz de quien cuenta
const say = (html, t, d, o = {}) => txt(html, t, d, { cls: 'tale', x: 160, y: 930, w: 1500, anchor: 'bottom', ...o });
const mid = (html, t, d, o = {}) => txt(html, t, d, { cls: 'tale big', align: 'center', y: 540, anchor: 'middle', ...o });

// ---------- I. Érase una vez ----------
bg(I('ilustracion-portada-brezal.jpg'), 1.2, 14.6, { z: [1.22, 1.02], y: [-30, 0], fi: 3, fo: 1.4 });
txt('Un cuento de Brezal', 0.6, 5.4, { cls: 'kicker', align: 'center', y: 470, anim: 'track', ls0: 0.9, ls1: 0.42, trackDur: 4.5, fi: 1.8 });
say('Érase una vez un valle, al pie de una montaña oscura…', 3.4, 5.4);
say('y bajo la tierra de ese valle, un <span class="ember-word">fuego</span> que dormía.', 9.0, 6.2);

// ---------- II. Las cadenas ----------
bg(I('ilustracion-ruinas-vharn.jpg'), 14.4, 12, { z: [1.04, 1.16], x: [40, -40], fo: 1.0 });
say('Los señores de Vharn lo tenían atado con cadenas de hierro frío.', 15.6, 5.0);
say('Mientras dormía, el trigo crecía alto y el agua del pozo bajaba fría.', 20.8, 5.2);

// ---------- III. El incendio ----------
bg(I('ilustracion-lugar-el-granero-quemado.jpg'), 25.6, 12.6, { z: [1.0, 1.22], pos: '50% 70%', fi: 0.6, fo: 1.2,
  filter: 'saturate(1.25) contrast(1.08)' });
say('Hasta que, una noche de fiesta, cuando todo el valle prestaba la lumbre…', 26.2, 4.8, { cls: 'tale small' });
mid('el granero <span class="ember-word">ardió</span>.', 31.0, 3.6, { cls: 'tale huge', stagger: 0.22, wordDur: 0.9 });
say('Con él cayeron los señores. Y con ellos, las cadenas.', 34.4, 3.9);

// ---------- IV. Los que callan ----------
bg(I('ilustracion-taberna-interior.jpg'), 37.8, 13, { z: [1.1, 1.18], filter: 'blur(14px) brightness(.32) saturate(.8)', fi: 1.2 });
custom(37.8, 13, (e) => {
  e.classList.add('cards');
  const ppl = ['retrato-osric-malvez.jpg', 'retrato-brenna.jpg', 'retrato-garran.jpg'];
  return { cards: ppl.map((f, k) => {
    const c = el('div', 'card', e); img(I(f), '', c); el('div', 'shade', c);
    c.style.left = (290 + k * 470) + 'px';
    return c;
  }) };
}, (lt, e, { cards }) => {
  e.style.opacity = env(lt, 13, 0.5, 1.2);
  cards.forEach((c, k) => {
    const p = ease.out(clamp((lt - 0.6 - k * 0.5) / 1.4));
    const flick = 0.82 + 0.08 * Math.sin(lt * 7 + k * 2) + 0.05 * Math.sin(lt * 13.3 + k);
    // Al final, las caras se apagan: nadie dice nada
    const dim = 1 - 0.55 * ease.sine(clamp((lt - 9.2) / 2.5));
    c.style.opacity = p;
    c.style.transform = `translateY(${(1 - p) * 60}px) scale(${lerp(0.94, 1, p) * lerp(1, 1.04, lt / 13)})`;
    c.style.filter = `brightness(${flick * dim}) sepia(.15)`;
  });
});
say('En el pueblo dicen que fue un candil mal apagado.', 39.2, 4.2);
say('Pero alguien vio una antorcha en la mano equivocada…', 43.6, 4.0);
say('y lleva veinte años callando.', 47.8, 3.2);

// ---------- V. La niebla ----------
bg(P('salvapantallas-6.jpg'), 50.6, 12.4, { z: [1.18, 1.04], y: [30, 0], fi: 1.6, filter: 'saturate(.85)' });
txt('Veinte años después', 51.0, 4.0, { cls: 'chapter', align: 'center', y: 470, anim: 'track', ls0: 0.7, ls1: 0.35, fi: 1.4 });
say('una niebla gris bajó del monte y cerró el valle.', 54.6, 3.6);
say('No la mueve el viento. No deja pasar a nadie.', 58.2, 2.6, { cls: 'tale small' });
say('Quien entra en ella… sale por donde entró.', 60.6, 2.6);

// ---------- VI. Señales ----------
bg(I('ilustracion-plaza-pozo.jpg'), 62.8, 6.4, { z: [1.04, 1.14], x: [-30, 30], fi: 1.0, fo: 0.8 });
say('Ahora el pozo trae agua tibia, y la aldea tose ceniza.', 63.4, 5.6);
bg(P('salvapantallas-3.jpg'), 68.8, 7, { z: [1.06, 1.2], y: [0, -20], fi: 0.6, fo: 1.0 });
say('Los lobos rondan los corrales.', 69.2, 2.8);
say('Y de noche… hay luz en el granero quemado.', 72.0, 3.6);

// ---------- VII. Alguien ha vuelto ----------
bg(P('salvapantallas-7.jpg'), 75.6, 11.2, { z: [1.02, 1.22], x: [0, 120], y: [0, 40], fi: 1.0 });
txt('Alguien ha vuelto.', 76.6, 3.6, { cls: 'tale big', x: 160, y: 520, anim: 'words', stagger: 0.18, wordDur: 1 });
say('Trae un ascua en el guante…', 80.4, 2.8);
say('y una pregunta que el valle no quiere responder.', 83.0, 3.6);

// ---------- VIII. Tres noches ----------
bg(I('ilustracion-amenaza.jpg'), 86.6, 10.6, { z: [1.0, 1.14], pos: '50% 35%', filter: 'brightness(.55)', fi: 1.0 });
custom(86.6, 10.6, (e) => {
  e.classList.add('nights');
  return { n: ['I', 'II', 'III'].map((r, k) => {
    const d = el('div', 'night', e); d.style.left = (960 - 110 + (k - 1) * 300) + 'px';
    const o = el('div', 'orb', d); el('div', 'lab', d, r); return { d, o };
  }) };
}, (lt, e, { n }) => {
  e.style.opacity = env(lt, 10.6, 0.6, 1.0) * (1 - 0.65 * ease.sine(clamp((lt - 5.2) / 1.2)));
  n.forEach(({ d, o }, k) => {
    const on = ease.out(clamp((lt - 0.8 - k * 1.3) / 0.8));
    d.style.opacity = 0.2 + 0.8 * on;
    const red = k === 2;
    const glow = on * (0.8 + 0.2 * Math.sin(lt * 6 + k));
    o.style.background = `radial-gradient(circle at 50% 55%, ${red ? 'rgba(255,90,30,' : 'rgba(255,200,120,'}${glow}) 0%, rgba(120,40,10,${glow * 0.4}) 45%, transparent 70%)`;
    o.style.boxShadow = `0 0 ${60 * glow}px ${red ? 'rgba(255,80,20,.8)' : 'rgba(255,190,110,.45)'}, inset 0 0 30px rgba(0,0,0,.6)`;
  });
});
txt('Tres noches.', 87.0, 4.6, { cls: 'tale big', align: 'center', y: 220, anim: 'words' });
txt('La tercera es la noche de la Brasa.', 90.4, 2.8, { cls: 'tale', align: 'center', y: 640, anim: 'words' });
mid('Para entonces, Brezal sabrá la verdad…<br>o arderá con ella.', 92.6, 4.6, { cls: 'tale big' });

// ---------- IX. La puerta ----------
bg(P('taberna.jpg'), 97.0, 7.0, { z: [1.0, 1.3], y: [0, 60], pos: '50% 60%', fi: 1.0, fo: 1.4 });
bg(I('ilustracion-taberna-interior.jpg'), 102.8, 8.4, { z: [1.25, 1.06], fi: 1.6, fo: 1.6 });
say('En la Taberna del Jabalí, alguien empuja la puerta.', 97.8, 4.6);
say('Eres tú. Acabas de llegar.', 102.6, 3.4);
say('Y este cuento… todavía no tiene final.', 106.2, 4.6);

// ---------- X. Lo escribes tú ----------
mid('Lo escribes <span class="ember-word">tú</span>.', 110.8, 3.6, { cls: 'tale big', stagger: 0.2, wordDur: 1 });
custom(113.6, 7.4, (e) => {
  e.classList.add('logo');
  const t = el('div', 'title-cinzel', e, 'TAVERNUS');
  Object.assign(t.style, { position: 'absolute', left: 0, width: '1920px', top: '360px', textAlign: 'center', fontSize: '180px' });
  const r = el('div', 'rule', e); Object.assign(r.style, { position: 'absolute', left: '660px', width: '600px', top: '600px' });
  const s = el('div', 'chapter', e, 'LAS CENIZAS DE VHARN'); Object.assign(s.style, { position: 'absolute', left: 0, width: '1920px', top: '630px', textAlign: 'center' });
  const s2 = el('div', 'tale small', e, 'Un juego de rol con un máster de IA · tavernus.com');
  Object.assign(s2.style, { position: 'absolute', left: 0, width: '1920px', top: '700px', textAlign: 'center', fontSize: '40px', color: 'rgba(246,234,210,.8)' });
  return { t, r, s, s2 };
}, (lt, e, { t, r, s, s2 }) => {
  const out = clamp((7.4 - lt) / 1.4);
  const p = ease.out(clamp(lt / 2.2));
  t.style.opacity = p * out; t.style.letterSpacing = lerp(0.5, 0.14, ease.outExpo(clamp(lt / 3))) + 'em';
  t.style.transform = `scale(${lerp(1.08, 1, p)})`;
  r.style.opacity = ease.out(clamp((lt - 1.2) / 1)) * out; r.style.transform = `scaleX(${ease.out(clamp((lt - 1.2) / 1.4))})`;
  s.style.opacity = ease.out(clamp((lt - 1.8) / 1)) * out;
  s2.style.opacity = ease.out(clamp((lt - 2.6) / 1)) * out;
});

// ---------- Capas globales ----------
levels.ember = kf([[0, 0], [2, 0.08], [9, 0.1], [12, 0.3], [15, 0.15], [25, 0.1], [28, 0.5], [31, 1], [36, 0.9], [38, 0.25], [50, 0.15],
  [51, 0.02], [62, 0.02], [69, 0.2], [72, 0.5], [76, 0.35], [80, 0.7], [86, 0.5], [90, 0.6], [94, 1], [97, 0.2], [103, 0.15], [110, 0.3], [114, 0.7], [119, 0.6], [121, 0]]);
levels.fog = kf([[0, 0], [5, 0.15], [14, 0.1], [25, 0], [50, 0], [52, 0.45], [62, 0.4], [64, 0.2], [69, 0.15], [75, 0], [97, 0], [100, 0.12], [104, 0]]);
levels.flash = kf([[0, 0], [30.6, 0], [31.3, 0.75], [32.2, 0.35], [33.0, 0.55], [35, 0.2], [37.5, 0], [93.5, 0], [95.5, 0.45], [97.5, 0]]);
</script>
</body>
</html>
