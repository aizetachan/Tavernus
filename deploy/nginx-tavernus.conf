# Alternativa a Caddy: nginx + certbot. setup-vps.sh --proxy nginx --domain D lo instala en
# /etc/nginx/sites-available/tavernus cambiando __DOMAIN__ y __WEB_PORT__, y después
# `certbot --nginx` añade el bloque 443 con el certificado y la redirección desde 80.
# certbot renueva solo (temporizador certbot.timer). Tras editarlo: nginx -t && systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 10m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    # Cuando certbot active HTTPS, descomenta:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Sin registro de accesos: las URLs llevan tokens de invitación y de admin.
    access_log off;

    # SSE: sin búfer ni compresión, y sin cortar la conexión a los 60 s.
    location = /api/stream {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La narración del máster puede tardar.
        proxy_read_timeout 120s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
